<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Atifinity's solid red-and-blue A brand mark with an embedded play triangle and an infinity-loop base">
  <defs>
    <linearGradient id="loopStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E3CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7A96FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E32227" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#1E3CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1E3CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurSm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurLg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ambient glow -->
  <circle cx="300" cy="280" r="230" fill="url(#coreGlow)"/>

  <!-- starfield -->
  <g fill="#F2F3F6">
    <circle cx="60" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="120" cy="40" r="1.2" opacity="0.35"/>
    <circle cx="500" cy="70" r="1.8" opacity="0.6"/>
    <circle cx="540" cy="150" r="1.2" opacity="0.4"/>
    <circle cx="40" cy="300" r="1.4" opacity="0.4"/>
    <circle cx="70" cy="470" r="1.6" opacity="0.5"/>
    <circle cx="550" cy="420" r="1.4" opacity="0.4"/>
    <circle cx="520" cy="520" r="1.8" opacity="0.5"/>
    <circle cx="300" cy="30" r="1.4" opacity="0.4"/>
    <circle cx="200" cy="550" r="1.4" opacity="0.4"/>
  </g>

  <!-- infinity-loop base, echoing the real Atifinity mark's swoop -->
  <path d="M300,430 C300,388 340,350 380,350 C428,350 460,388 460,430 C460,472 428,510 380,510 C340,510 300,472 300,430 C300,472 260,510 220,510 C172,510 140,472 140,430 C140,388 172,350 220,350 C260,350 300,388 300,430 Z"
        fill="none" stroke="url(#loopStroke)" stroke-width="3" opacity="0.8"/>

  <!-- particles along the loop -->
  <circle cx="220" cy="350" r="3.2" fill="#1E3CFF" filter="url(#blurSm)"/>
  <circle cx="380" cy="350" r="3.2" fill="#E32227" filter="url(#blurSm)"/>
  <circle cx="300" cy="430" r="2.4" fill="#F2F3F6"/>

  <!-- soft glow duplicate behind the solid mark -->
  <g opacity="0.35" filter="url(#blurLg)">
    <path d="M300,90 L160,361 L230,361 L344,177 Z" fill="#E32227"/>
    <path d="M366,195 L440,361 L374,361 L318,248 Z" fill="#1E3CFF"/>
  </g>

  <!-- main solid two-tone "A" mark — red left stroke, blue right stroke, blue crossbar -->
  <path d="M300,90 L160,361 L230,361 L344,177 Z" fill="#E32227"/>
  <path d="M366,195 L440,361 L374,361 L318,248 Z" fill="#1E3CFF"/>
  <path d="M283,300 L344,300 L361,361 L243,361 Z" fill="#1E3CFF"/>

  <!-- embedded play triangle, nested in the mark's gap, echoing the real logo's video accent -->
  <path d="M285,215 L285,265 L325,240 Z" fill="#E32227" filter="url(#blurSm)"/>
  <path d="M285,215 L285,265 L325,240 Z" fill="#E32227"/>
</svg>
