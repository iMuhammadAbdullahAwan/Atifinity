<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-label="Channel dashboard before Affinity's growth system: a flat, slowly declining views chart and plain, low-contrast video thumbnails">
  <rect width="700" height="460" fill="#0C121F"/>
  <!-- top bar -->
  <rect x="0" y="0" width="700" height="40" fill="#0F1626"/>
  <circle cx="22" cy="20" r="5" fill="#FF3CAC" opacity="0.6"/>
  <circle cx="42" cy="20" r="5" fill="#FFC857" opacity="0.6"/>
  <circle cx="62" cy="20" r="5" fill="#00F5D4" opacity="0.6"/>

  <!-- left: flat/declining chart panel -->
  <g transform="translate(28,64)">
    <rect width="300" height="360" rx="14" fill="#111627"/>
    <text x="20" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#A6ADC3">Channel Views</text>
    <polyline points="20,220 60,210 100,225 140,215 180,235 220,228 260,245" fill="none" stroke="#5B6478" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#22293C" stroke-width="1">
      <line x1="20" y1="150" x2="280" y2="150"/>
      <line x1="20" y1="190" x2="280" y2="190"/>
      <line x1="20" y1="230" x2="280" y2="230"/>
      <line x1="20" y1="270" x2="280" y2="270"/>
    </g>
    <text x="20" y="320" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#F7F7FA">48K</text>
    <text x="20" y="342" font-family="Poppins, sans-serif" font-size="11" fill="#6B7280">avg. monthly views</text>
  </g>

  <!-- right: plain thumbnail grid -->
  <g transform="translate(352,64)">
    <rect width="320" height="360" rx="14" fill="#111627"/>
    <g fill="#1C2336">
      <rect x="18" y="18" width="130" height="80" rx="8"/>
      <rect x="164" y="18" width="130" height="80" rx="8"/>
      <rect x="18" y="112" width="130" height="80" rx="8"/>
      <rect x="164" y="112" width="130" height="80" rx="8"/>
      <rect x="18" y="206" width="130" height="80" rx="8"/>
      <rect x="164" y="206" width="130" height="80" rx="8"/>
    </g>
    <g fill="none" stroke="#3A4258" stroke-width="1.6">
      <rect x="18" y="18" width="130" height="80" rx="8"/>
      <rect x="164" y="18" width="130" height="80" rx="8"/>
      <rect x="18" y="112" width="130" height="80" rx="8"/>
      <rect x="164" y="112" width="130" height="80" rx="8"/>
      <rect x="18" y="206" width="130" height="80" rx="8"/>
      <rect x="164" y="206" width="130" height="80" rx="8"/>
    </g>
    <text x="18" y="322" font-family="Poppins, sans-serif" font-size="11" fill="#6B7280">Generic thumbnails, low CTR</text>
  </g>
</svg>
