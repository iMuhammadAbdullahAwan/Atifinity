<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" role="img" aria-label="Channel dashboard after Affinity's growth system: a steep rising views chart and vibrant, high-contrast video thumbnails">
  <rect width="700" height="460" fill="#0C121F"/>
  <defs>
    <linearGradient id="afterLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#6C3AFF"/>
    </linearGradient>
    <linearGradient id="afterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F5D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C3AFF"/><stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF3CAC"/><stop offset="1" stop-color="#6C3AFF"/>
    </linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF3CAC"/>
    </linearGradient>
  </defs>

  <!-- top bar -->
  <rect x="0" y="0" width="700" height="40" fill="#0F1626"/>
  <circle cx="22" cy="20" r="5" fill="#FF3CAC"/>
  <circle cx="42" cy="20" r="5" fill="#FFC857"/>
  <circle cx="62" cy="20" r="5" fill="#00F5D4"/>

  <!-- left: rising chart panel -->
  <g transform="translate(28,64)">
    <rect width="300" height="360" rx="14" fill="#111627"/>
    <text x="20" y="34" font-family="Poppins, sans-serif" font-size="13" font-weight="600" fill="#F7F7FA">Channel Views</text>
    <polygon points="20,260 60,235 100,210 140,175 180,140 220,95 260,55 260,290 20,290" fill="url(#afterFill)"/>
    <polyline points="20,260 60,235 100,210 140,175 180,140 220,95 260,55" fill="none" stroke="url(#afterLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="55" r="5" fill="#00F5D4"/>
    <g stroke="#22293C" stroke-width="1">
      <line x1="20" y1="150" x2="280" y2="150"/>
      <line x1="20" y1="190" x2="280" y2="190"/>
      <line x1="20" y1="230" x2="280" y2="230"/>
      <line x1="20" y1="270" x2="280" y2="270"/>
    </g>
    <text x="20" y="320" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#F7F7FA">1.2M</text>
    <text x="20" y="342" font-family="Poppins, sans-serif" font-size="11" fill="#00F5D4">avg. monthly views</text>
  </g>

  <!-- right: vibrant thumbnail grid -->
  <g transform="translate(352,64)">
    <rect width="320" height="360" rx="14" fill="#111627"/>
    <rect x="18" y="18" width="130" height="80" rx="8" fill="url(#thumb1)"/>
    <rect x="164" y="18" width="130" height="80" rx="8" fill="url(#thumb2)"/>
    <rect x="18" y="112" width="130" height="80" rx="8" fill="url(#thumb3)"/>
    <rect x="164" y="112" width="130" height="80" rx="8" fill="url(#thumb1)"/>
    <rect x="18" y="206" width="130" height="80" rx="8" fill="url(#thumb2)"/>
    <rect x="164" y="206" width="130" height="80" rx="8" fill="url(#thumb3)"/>
    <g fill="#F7F7FA" opacity="0.9">
      <polygon points="70,50 70,66 84,58"/>
      <polygon points="216,50 216,66 230,58"/>
      <polygon points="70,144 70,160 84,152"/>
      <polygon points="216,144 216,160 230,152"/>
      <polygon points="70,238 70,254 84,246"/>
      <polygon points="216,238 216,254 230,246"/>
    </g>
    <text x="18" y="322" font-family="Poppins, sans-serif" font-size="11" fill="#00F5D4">Bold thumbnails, high CTR</text>
  </g>
</svg>
